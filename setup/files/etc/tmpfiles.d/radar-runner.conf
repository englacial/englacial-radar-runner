# Directories of the radar manager. Installed by englacial-radar-runner
# (setup/setup.sh; see setup/SYSTEM_CHANGES.md). Delete this file to revert.
#
# Applied at every boot, parents before the directories inside them, and also
# to directories that already exist. The power service starts very early and
# may have created /run/radar-runner (root:root 0755) before this runs; that
# is the same owner and mode as here, so the two never disagree.
#
# /run/radar-runner and /var/lib/radar-runner belong to root and hold the
# power service's files. Only root can create files in them. The services that
# run as user englacial get a "user" directory inside each and write nowhere
# else; root never writes inside "user". So neither side can block or redirect
# the other's writes.

#Type Path                        Mode User      Group     Age
d     /run/radar-runner           0755 root      root      -
d     /run/radar-runner/user      0755 englacial englacial -
d     /var/lib/radar-runner       0755 root      root      -
d     /var/lib/radar-runner/user  0755 englacial englacial -
d     /etc/radar-runner           0755 root      root      -
