# Installed by englacial-radar-runner (setup/setup.sh; see
# setup/SYSTEM_CHANGES.md). Delete this file to revert.
#
# The unattended-upgrades package raises this to 30 s
# (/usr/lib/systemd/logind.conf.d/unattended-upgrades-logind-maxdelay.conf),
# which lets a program delay a shutdown for half of the UPS capacitor's run
# time. 5 s is the systemd default. This file's name sorts after that one, so
# this value wins.
[Login]
InhibitDelayMaxSec=5
