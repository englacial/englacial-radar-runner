# Installed by englacial-radar-runner (setup/setup.sh; see
# setup/SYSTEM_CHANGES.md). Delete this file to revert.
#
# Keep the journal on the SD card, and keep more history than the defaults do.
# Every boot starts at least two new journal files of 8 MB each, so the
# defaults (4 GB, 100 files) hold only about 50 boots. These limits hold
# several hundred, on a 117 GB card.
[Journal]
Storage=persistent
SystemMaxUse=8G
SystemMaxFiles=1000
