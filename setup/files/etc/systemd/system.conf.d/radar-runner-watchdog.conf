# Installed by englacial-radar-runner (setup/setup.sh; see
# setup/SYSTEM_CHANGES.md). Delete this file to revert.
#
# Hardware watchdog: if systemd (PID 1) stops running for 30 s, or the kernel
# hangs (the hardware's own limit is about 15 s), the Pi resets and boots
# again. systemd pings the watchdog every 15 s.
#
# Never set a timeout that is a multiple of 16 s (16s, 32s, 48s, ...) with
# this driver (bcm2835_wdt): the hardware counter holds just under 16 s and
# wraps, so such a value programs a timeout of zero.
#
# RebootWatchdogSec is the systemd default, written out: a reboot that hangs
# in its last phase is forced after 10 minutes. For a power-off, systemd is
# expected to switch the watchdog off, so that the Pi stays off. That is how
# systemd is understood to behave; it has to be confirmed on the bench (the
# three tests in setup/SYSTEM_CHANGES.md) before this file ships.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
