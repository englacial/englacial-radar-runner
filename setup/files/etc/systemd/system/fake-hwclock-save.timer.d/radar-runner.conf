# Save the clock every minute, not every hour. Installed by
# englacial-radar-runner (setup/setup.sh; see setup/SYSTEM_CHANGES.md).
# Delete this file to revert.
#
# The Pi's clock has no battery. fake-hwclock restores the saved time at boot;
# after a hard power cut the clock then starts at most a minute behind the
# moment of the cut (as systemd-timesyncd did), not up to an hour.
# Counted from boot and from the last save, so that a clock step cannot upset it.

[Timer]
OnCalendar=
OnBootSec=1min
OnUnitActiveSec=1min
AccuracySec=5s
