# Clock steps at any time, not only just after chrony starts. Installed by
# englacial-radar-runner (setup/setup.sh; see setup/SYSTEM_CHANGES.md).
# Delete this file to revert.
#
# This Pi's clock has no battery: it starts from a saved time (fake-hwclock)
# that is wrong by as long as the Pi was off, and the first time source, GPS
# or the network, may appear at any moment. Ubuntu's chrony.conf has
# "makestep 1 3": step only in the first three updates, and slew afterwards.
# After a wrong first setting, slewing to the right time would take hours.
# "makestep 1 -1" steps whenever the clock is off by more than 1 s. Nothing in
# the radar manager depends on the wall clock running evenly: its logs carry
# the uptime, and the telemetry service records every step.
#
# It is set here, with chronyc once chronyd is up, because a file in
# /etc/chrony/conf.d cannot do it: Ubuntu's chrony.conf reads that directory
# first and its own "makestep 1 3" comes later and wins. chronyd logs
# "New makestep 1.000000 -1". The "-" means: if the command fails, chrony
# still runs, with Ubuntu's setting.

[Service]
ExecStartPost=-/usr/bin/chronyc makestep 1 -1
