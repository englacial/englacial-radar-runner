# gpsd owns the GPS receiver. Installed by englacial-radar-runner
# (setup/setup.sh; see setup/SYSTEM_CHANGES.md). Delete this file to revert.
#
# -n   keep reading the receiver when no client is connected, so that chrony
#      always has GPS time (gpsd(8): needed for a time source).
# The receiver is named on the command line by its stable path, and gpsd is
# tied to that device: systemd starts gpsd when the receiver appears (the
# device unit wants gpsd.service; setup.sh adds that) and stops it when the
# receiver is unplugged, so a replugged receiver gets a fresh gpsd. gpsd 3.25
# drops a device that it cannot open and does not look for it again by itself.
#
# Ubuntu's own hotplug path (udev -> gpsdctl@.service -> "gpsdctl add") is
# switched off by gpsdctl@.service.d/radar-runner.conf. With both in use the
# receiver was added twice at boot, the second open failed with "Device or
# resource busy", and gpsd ended up delivering nothing (seen 2026-11-19).

[Unit]
BindsTo=dev-serial-by\x2did-usb\x2du\x2dblox_AG_\x2d_www.u\x2dblox.com_u\x2dblox_GNSS_receiver\x2dif00.device
After=dev-serial-by\x2did-usb\x2du\x2dblox_AG_\x2d_www.u\x2dblox.com_u\x2dblox_GNSS_receiver\x2dif00.device

[Service]
ExecStart=
ExecStart=/usr/sbin/gpsd -n /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver-if00
Restart=on-failure
RestartSec=5
