# Switches off Ubuntu's gpsd hotplug path. Installed by englacial-radar-runner
# (setup/setup.sh; see setup/SYSTEM_CHANGES.md). Delete this file to revert.
#
# udev starts gpsdctl@ttyACM<n>.service for a u-blox receiver, which runs
# "gpsdctl add". gpsd is given the receiver on its command line and is started
# and stopped with the device (gpsd.service.d/radar-runner.conf), so a second
# add only makes gpsd open the same receiver twice.

[Service]
ExecStart=
ExecStart=/bin/true
ExecStop=
ExecStop=/bin/true
