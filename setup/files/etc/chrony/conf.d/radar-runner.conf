# Time sources and clock steps for the radar Pi. Installed by
# englacial-radar-runner (setup/setup.sh; see setup/SYSTEM_CHANGES.md).
# Delete this file and restart chrony to revert.
#
# Ubuntu's /etc/chrony/chrony.conf stays as it is: its NTP pools are used
# whenever the internet is up.

# GPS time from gpsd, through shared memory segment 0 (gpsd writes the time of
# each second's fix once it has a position fix). No PPS reaches the Pi, so this
# is the time of the receiver's messages over USB:
#   offset 0.070  the messages arrive about 70 ms late (measured 2026-11-19
#                 against NTP: median 69 ms, range 58-82 ms)
#   delay 0.2     tells chrony to trust it to +/- 0.1 s only, so that NTP
#                 servers are preferred whenever they can be reached
#   poll 3        one filtered value every 8 s: the clock is set about half a
#                 minute after gpsd starts delivering time
refclock SHM 0 refid GPS poll 3 offset 0.070 delay 0.2

# The clock step setting ("makestep 1 -1") is not here: Ubuntu's chrony.conf
# reads this directory first and sets "makestep 1 3" afterwards, and the last
# one counts. It is set when chrony starts, by
# /etc/systemd/system/chrony.service.d/radar-runner.conf.
