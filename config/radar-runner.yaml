# Radar manager configuration (all services except the power service, which
# has its own file: config/power.toml).
#
# This file is layer 2 of 4. Each layer overrides the one before:
#   1. the defaults built into radar_runner/common/config.py
#   2. this file (in git; the same on every unit)
#   3. /etc/radar-runner/local.yaml     this unit only: calibration, thresholds
#   4. /etc/radar-runner/secrets.yaml   tokens and credentials (mode 0640, root:englacial)
# Layers 3 and 4 are optional, are not in git, and may set any subset of the
# settings below, in the same layout.
#
# Every value below is the built-in default. An unknown setting or a value of
# the wrong type is ignored with a warning in the service's log and status
# file; it never stops a service. To see the merged result and any warnings:
#   cd ~/englacial-radar-runner && .venv/bin/python -m radar_runner.common.config

paths:
  # The first two belong to user englacial. Their parent directories belong to
  # root and hold only the power service's files.
  run_dir: /run/radar-runner/user                   # status files: <run_dir>/<service>.json
  state_dir: /var/lib/radar-runner/user             # small state that must survive a reboot
  power_status_file: /run/radar-runner/power.json   # written by the power service; read only

status:
  stale_after_s: 5.0    # a status file older than this is treated as "no information"

logging:
  level: info           # debug, info, warning or error

# Telemetry service: OLA (amplifier sensors, IMU), Pi sensors, UPS readings and
# GPS position. Logs, status file and how to stop it: radar_runner/telemetry/README.md
telemetry:
  loop_interval_s: 0.25       # how often the sources are read
  status_interval_s: 0.5      # how often /run/radar-runner/user/telemetry.json is rewritten
  data_root: /mnt/nvme/radar-runner   # sensor logs go to <data_root>/telemetry/b<boot>/
  data_mount: /mnt/nvme       # must be a mount point for data_root to be used ("-": no check)
  fallback_dir: /var/lib/radar-runner/user/telemetry-fallback   # on the SD card, while the drive is unusable
  fallback_max_mb: 1000       # the oldest fallback files are deleted above this
  flush_interval_s: 1.0       # rows are handed to the kernel this often
  fsync_interval_s: 30.0      # each file is forced to the drive this often (one file per second, in turn).
                              # A hard power cut loses at most about 35 s of rows with these two values;
                              # a normal shutdown loses nothing. TO MEASURE IN STAGE 4 before lowering it:
                              # what a sync costs while the radar records (see telemetry/csvlog.py)
  ola:
    port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    baud: 115200
    log_interval_s: 0.0       # 0: log every row (about 10 per second, 210 MB per 24 h); 1.0: one per second
    fresh_s: 2.0              # amplifier readings older than this are published as not fresh
    boot_timeout_s: 25.0      # no header this long after opening the port: drive the menus anyway
    menu_timeout_s: 15.0      # wait for each menu
    silent_s: 20.0            # no valid row for this long: reopen the port, which resets the OLA
    # Every reopening resets the OLA. The waits double with every failure in a row and start short
    # again only after stable_s of good rows, so that a broken OLA is reset about once an hour.
    reopen_s: 5.0             # wait before reopening the port; doubles up to reopen_max_s
    reopen_max_s: 3600.0
    retry_s: 30.0             # wait before driving the menus again after they failed; doubles up to retry_max_s
    retry_max_s: 3600.0
    stable_s: 300.0
    # Calibration of the ADS1015 readings, from the control board and the bench
    # (radar-testbench/pa_bringup/pa_run.py). Per-unit values belong in local.yaml.
    temp_divider: 2.0         # amplifier pin 3 reaches the ADC through a 1:2 divider
    temp_mv_per_c: 10.0       # amplifier pin 3: 10 mV per degree C
    current_divider: 2.0      # amplifier pin 2 reaches the ADC through a 1:2 divider
    current_mv_per_a: 500.0   # amplifier pin 2: 50 mV per 100 mA
    current_cal: 1.5          # the ADC read 0.66-0.68 of the clamp meter on the supply wire (2026-11-05,
                              # cause unknown; pa_run.py ADC_CURRENT_CAL). Not re-checked with the 28 V on
    voltage_ratio: 11.0       # 28 V rail through 100k/10k
  pi:
    interval_s: 2.0           # SoC temperature, throttling, load, memory, disk space, drive temperatures, fan
  ups:
    interval_s: 1.0           # capacitor voltage and current, from the power service's status file
    stale_after_s: 3.0        # the power service rewrites its file about once a second
  gps:
    host: 127.0.0.1           # gpsd; the service only asks gpsd for data and never sends to the receiver
    port: 2947
    interval_s: 1.0           # one position per second (the receiver itself runs at 10 Hz)
    stale_after_s: 5.0        # no new fix time for this long: stale
    answer_timeout_s: 10.0    # no answer from gpsd for this long: reconnect
    reconnect_s: 5.0
    no_data_error_s: 30.0     # receiver present but no fix time for this long: reported as an error
    # Each time the OLA starts it turns NMEA output on the receiver's unused UART1 back on, which
    # overflows the receiver's transmit buffer at 10 Hz. This command turns it off again (in the
    # receiver's RAM, through gpsd) a little after every OLA start. "" = never run it.
    receiver_fix_command: "/usr/bin/python3 -B /home/englacial/englacial-radar-runner/setup/gps_receiver.py --apply --ram"
    receiver_fix_delay_s: 15.0

# Safety watcher: stops the radar and resets the SDR GPIO on unsafe amplifier readings.
# The rules, and where each number comes from: radar_runner/watcher/README.md
watcher:
  loop_interval_s: 0.5        # how often everything is looked at and /run/radar-runner/user/watcher.json rewritten
                              # (the telemetry service publishes a new reading every 0.5 s)
  # A process with this executable is a radar process. "manager": the binary that the radar manager
  # runs (manager.orca: dir/radar_cwd/radar_command), so that the two cannot diverge; or a full path.
  radar_exe: manager
  telemetry_status_file: telemetry.json       # the telemetry service's status: a file name in paths.run_dir, or a full path
  # The next two and reset.state_file: a file name in paths.state_dir, or a full path.
  override_file: override-no-amp-telemetry    # the user's "run without amplifier telemetry" (radarctl override no-amp-telemetry on)
  events_file: watcher-events.jsonl           # the event log: trips, clears, actions and their results
  events_max_mb: 5.0          # then the file is renamed to .1 and a new one started
  telemetry_lost_s: 3.0       # no usable amplifier reading for this long: not ok (the radar may not run)
  require_case_temp: true     # a reading without the case temperature (TMP117) is not usable
  # A limit trips when trip_samples of the last trip_window readings are beyond it and those span
  # trip_span_s (one damaged reading does nothing, and one good reading in between does not hide a
  # fault). It clears only after clear_hold_s of readings on the good side of the recover level.
  trip_samples: 3
  trip_window: 5
  trip_span_s: 1.0
  clear_hold_s: 30.0
  temp_warn_c: 50.0           # amplifier sensor or case sensor: warning
  temp_trip_c: 55.0           # stop the radar
  temp_clear_c: 50.0          # the stop clears below this
  voltage_min_v: 26.0         # 28 V rail while the amplifier is powered: stop outside these two
  voltage_max_v: 30.5
  voltage_recover_margin_v: 0.5   # the stop clears this far inside the two limits (26.5-30.0 V)
  unpowered_below_v: 20.0     # below this the amplifier is unpowered: no trip and no action, but not ok
  allow_unpowered: false      # true: an unpowered amplifier is ok (bench work with the 28 V off). PER UNIT
  enabled_current_a: 0.5      # above this the amplifier is enabled (shutdown 0.156 A, enabled about 2.5 A)
  idle_enabled_s: 5.0         # enabled for this long with no radar process: run the reset tool
  reset:
    command: /home/englacial/englacial-radar-runner/tools/sdr_gpio_safe/amp_safe
    timeout_s: 30.0           # amp_safe --timeout (a first contact after power-up took 16.7 s)
    kill_margin_s: 5.0        # amp_safe is given up on this long after its own timeout
    state_file: sdr-state     # amp_safe --state-file: the record shared with the radar manager
    retry_prompt_s: 2.0       # wait before the next run after ASSUME_ENABLED (exit 3)
    retry_s: 5.0              # wait after any other result, while the amplifier stays enabled
    stuck_after_attempts: 3   # still enabled after this many runs: "stuck enabled", urgent
    stuck_retry_s: 60.0       # while stuck: one run this often (each run is an enable pulse)
    blocked_after_s: 30.0     # the tool cannot run at all (BUSY, NOT_FOUND, ...) for this long: urgent
    blocked_retry_s: 15.0     # ... and then one try this often (such a try is no enable pulse)
    blind_delay_s: 20.0       # no telemetry and no radar for this long, and the pin not known safe: run the tool
    blind_retry_s: 300.0      # ... and again this often while that lasts
  stop_grace_s: 5.0           # not ok for this long with a radar process still alive: SIGINT to it
                              # (seconds not ok count up, seconds ok count down: flapping does not restart it)
  radar_setup_s: 65.0         # a radar process younger than this is never signalled: it may be setting up the
                              # SDR (17 s at a first contact), and dying there leaves the amplifier enabled.
                              # Longer than manager.orca.start_timeout_s + stop_timeout_s (60 s + 3 s): until
                              # then the stop is the manager's, which waits for ORCA's start line
  radar_exit_s: 5.0           # still alive this long after SIGINT: SIGKILL
  kill_retry_s: 5.0           # still alive: SIGKILL again this often

# Radar manager: starts and stops the radar (button, radarctl, later GPS motion)
# behind the safety gates. States, gates, faults and files: radar_runner/manager/README.md
# Values marked PER UNIT depend on the hardware of one unit: set them in
# /etc/radar-runner/local.yaml.
manager:
  tick_s: 0.1                 # main loop period: reaction time to the button and to radarctl
  gate_interval_s: 0.5        # how often the gates are evaluated
  status_interval_s: 1.0      # the status file is rewritten at least this often
  radar_config: /etc/radar-runner/radar.yaml     # the requested ORCA config (PER UNIT)

  triggers:
    button: true
    command: true             # radarctl start/toggle; stop and clear-fault always work
    gps: false                # the motion trigger (stage 6)

  run:
    manual_timeout_s: 50400.0           # a manually started run is stopped after this (14 h); 0 = never
    retry_delays_s: [10.0, 30.0, 90.0]  # wait before each retry of a failed start; then fault
    max_resumes: 5                      # automatic resumes after a gate stopped the run; then fault
    resume_holdoff_s: 10.0              # the gates must have been good for this long before a resume
    stable_run_s: 300.0                 # running this long clears the retry and resume counts
    max_restarts_per_hour: 12           # automatic restarts (retries and resumes) in any hour; then fault
    max_starts_per_hour: 40             # starts of any kind in any hour, fresh runs included; then fault
    min_start_gap_s: 5.0                # no start sooner than this after the last run ended

  gates:
    # Status file of the telemetry service. status_file "-" = <paths.run_dir>/telemetry.json
    telemetry:
      status_file: "-"
      max_age_s: 3.0
      require_true: [amp.fresh]         # dotted paths that must be true
      require_false: []                 # dotted paths that must be false
      reason_field: amp.reason          # shown when a requirement fails
    # Status file of the safety watcher: at least ok, tripped and reason. "-" = <paths.run_dir>/watcher.json
    watcher:
      status_file: "-"
      max_age_s: 5.0
      require_true: [ok]
      require_false: [tripped]
      reason_field: reason
    power:
      max_age_s: 5.0                    # of paths.power_status_file
    data:
      mount_point: /mnt/nvme            # must be a mounted file system: never the SD card
      root: /mnt/nvme/radar-runner/collections
      start_min_free_gb: 20.0           # do not start below this
      stop_min_free_gb: 5.0             # stop a running collection below this
    sdr:
      sysfs_dir: /sys/bus/usb/devices
      usb_vendor: "2500"                              # Ettus Research
      usb_products: ["0020", "0021", "0022", "0023"]  # B200, B200mini, B205mini, B206mini
      min_speed_mbps: 5000                            # USB 3
      # Until the first UHD start after power-up the SDR runs its boot loader,
      # a USB 2 device with this product name: its link speed is then unknown
      # and the gate passes. The runner reads the speed from sysfs again after the radar's start line.
      bootloader_product: WestBridge

  # Fixed limits on the radar config, checked before every start.
  limits:
    amp_pin: 2                # GPIO.pwr_amp_pin as wired on the bench (DB15 pin 2 = GPIO_0)
    amp_active_low: true
    gpio_bank: FP0
    # PER UNIT, CONSERVATIVE DEFAULT: depends on the VVA (J8) setting, which is
    # not decided. 43 keeps the output near 1.6 W even at full amplifier gain
    # (VVA 0 V: tx_gain 41 = 1.0 W, 52 = 10.9 W, measured 2026-11-05). At VVA 5 V
    # the bench limit is 72 (3 dB under the amplifier's +10 dBm input rating at
    # 300 MHz); never above 76.
    max_tx_gain: 43.0
    # PER UNIT. CHIRP.tx_duration / CHIRP.pulse_rep_int. 0.15 is the bench
    # fixture's limit; the 10 W soak ran at 0.14.
    max_enable_duty: 0.15
    min_freq_hz: 225000000.0  # the chirp band must lie inside these (antennas: 225-400 MHz)
    max_freq_hz: 400000000.0
    clk_refs: [internal, external]      # "gpsdo" makes ORCA open and reconfigure the GPS receiver

  orca:
    dir: /home/englacial/orca
    # Extra environment for the commands below, as "NAME=value". ORCA's build reads CONDA_PREFIX.
    env: ["CONDA_PREFIX=/home/englacial/miniforge3/envs/orca"]
    chirp_command: [/home/englacial/miniforge3/envs/orca/bin/python, generate_chirp.py, "{config}"]
    chirp_cwd: preprocessing  # relative to dir
    chirp_timeout_s: 120.0
    # Only the radar target, not ORCA's tests. The UHD is named in full, so that a new build
    # directory and an old one give the same binary: the build that leaves the SDR's front-panel
    # pins as inputs at initialisation (setup/pins.toml: uhd_prefix), with the environment that
    # holds Boost and yaml-cpp. The two -U drop the library and headers that an earlier configure
    # found: without them an old build directory keeps its UHD. setup/check.py checks which
    # libuhd the built radar loads.
    build_commands:
      - [cmake, "..", "-UUHD_LIBRARIES", "-UUHD_INCLUDE_DIRS",
         "-DCMAKE_PREFIX_PATH=/home/englacial/uhd-patched-gpio;/home/englacial/miniforge3/envs/orca",
         "-DUHD_DIR=/home/englacial/uhd-patched-gpio/lib/cmake/uhd", "-DCMAKE_BUILD_RPATH=/home/englacial/uhd-patched-gpio/lib"]
      - [make, radar]
    build_cwd: sdr/build
    build_timeout_s: 900.0
    radar_command: [./radar, "{config_rel}"]    # {config_rel}: the config, relative to dir
    radar_cwd: sdr/build      # ORCA resolves its paths from two levels below dir
    launch_prefix: [/usr/bin/setpriv, --pdeathsig, KILL]    # the radar is killed if the manager dies
    start_line: "[START]"     # the radar's own "recording has begun" line
    # From launch to that line. The first start after power-up loads the SDR's
    # firmware and FPGA first: 14 s measured, then about 5 s of set-up.
    start_timeout_s: 60.0
    stop_timeout_s: 3.0       # from SIGINT to exit; then SIGKILL
    # An urgent stop (power loss, the manager's own exit): the radar has no SIGINT
    # handler before its start line, so the stop waits for that line for at most
    # urgent_grace_s; the radar process is gone, killed if need be,
    # urgent_stop_budget_s after the stop was asked for.
    urgent_grace_s: 1.0
    urgent_stop_budget_s: 3.0
    require_usb3: true        # after the start line the SDR must be at min_speed_mbps (sysfs)

  data:
    chunk_mb: 128.0           # the radar starts a new data file at about this size ...
    chunk_max_s: 300.0        # ... or after this long, whichever is first
    log_part_mb: 32.0         # the radar's output log is split into parts of this size; all is kept

  # Making the amplifier safe: the tool that drives the SDR's amplifier pin to the
  # shutdown level. It runs only when the pin is not known to be safe. A command
  # that is missing means the radar is never started.
  amp_safe:
    # The manager adds "--state-file <state_dir>/sdr-state". --timeout is mandatory
    # for the tool: 30 s covers a first contact after power-up (16.7 s measured).
    command: [/home/englacial/englacial-radar-runner/tools/sdr_gpio_safe/amp_safe, --timeout, "30"]
    # The file that the tool's wrapper locks while it runs. "-" = the first word of command (the
    # wrapper locks itself). The manager never records "safe" while the lock is held.
    lock_file: "-"
    timeout_s: 40.0           # the manager kills the tool after this; must be longer than --timeout
    assume_enabled_retries: 2 # immediate retries when the tool says ASSUME_ENABLED (exit 3)
    unavailable_retries: 3    # after a radar exit: retries of NOT_FOUND, BUSY and TIMEOUT ...
    unavailable_delay_s: 5.0  # ... this far apart (the SDR may be coming back after a kill)
    retry_s: 60.0             # with no radar and the state unknown: try the tool this often
    current_field: amp.current_a        # the reading in the telemetry status file that decides, when fresh
    voltage_field: amp.voltage_v
    sample_uptime_field: amp.sample_uptime_s
    enabled_current_a: 0.5    # at or above: enabled (shutdown 0.16 A, enabled about 2.5 A)
    min_voltage_v: 20.0       # below: the 28 V rail is off and the current says nothing
    # A shutdown-current reading counts only if the Pi read it this long after the
    # last radar or tool run ended: 1 s, plus 1 s because a row is read later than
    # the ADC measured it.
    confirm_settle_s: 2.0
    confirm_timeout_s: 5.0    # after a radar exit: wait this long for such a reading
    # ... and only if the telemetry service's loop was not stalled when it read the row.
    loop_gap_field: loop.last_gap_s
    max_loop_gap_s: 1.0

  panel:
    enabled: true
    button_gpio: 4
    green_gpio: 17
    yellow_gpio: 18
    breathing: pwm            # pwm, or blink if PWM does not work through the LED's regulator
    pwm_hz: 200               # PWM frequency of the READY LED
    kernel_debounce_s: 0.02   # edges closer together than this never reach the manager
    press_min_s: 0.1          # a press is the button held between these two times ...
    press_max_s: 5.0
    press_gap_s: 1.0          # ... and at least this long after the press before
    fast_blink_s: 0.15        # on time = off time
    slow_blink_s: 0.6
    breath_s: 1.2             # fade in = fade out

  events:
    file: "-"                 # "-" = <paths.state_dir>/manager-events.jsonl
    max_mb: 5.0               # then the file is renamed to .1 and a new one started
